name = "[16th] - Phoenix Company"
author = "PhoenixTEAM"
prefix = "PC"
mainprefix = "x"

[version]
path = "addons/main/script_version.hpp"
git_hash = 0

[files]
include = [
    "mod.cpp",
    "meta.cpp",
    "*.paa",
    "*.dll",
    "LICENSE.md",
    "README.md",
]
exclude = [
    "*.blend*",
    "*.fbx",
    "*.ini",
    "*.md",
    "*.png",
    "*.psd",
    "*.spp*",
    "server.cfg",
]

[hemtt.release]
sign = true
binarize = true
rapify = true
archive = true

[hemtt.launch.default]
workshop = []
presets = [
    "preset",
]
dlc = []
optionals = []
parameters = [
    "-noPause",
    "-noPauseAudio",
]
