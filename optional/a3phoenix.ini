[Default]

Version = 1
;; Used incase there is ever a breaking change, or to inform user in log about a new feature.

Strip Chars = ";[]"
;; List of characters to strip out

Strip Chars Mode = 0
;; 0 = Strip Bad Chars, 1 = Strip + Log Bad Chars, 2 = Return Error & Log Bad Chars
;;     Note: Logging on works when sending data to database.

Input SQF Parser = false
;; Expermential
;;   If enabled will use SQF Array Parser instead of : seperator for values
;;   i.e   0:SQL:UpdatePlayer:["Joe",[1,2,0],0.22333,"PlayerBackpack",-3]
;;   Advantage is that you don't need to strip : seperator from user inputted values

Number of Retrys = 5
;; Number of Retrys if Error Encountered
;;  Note: If doing multiple SQL i.e SQL1_1 SQL2_1 etc, it will retry everything.

[getUserBySteamId]
;; 1 = steam_id

SQL1_1 = SELECT money, is_medic, is_eod, loadout FROM users WHERE steam_id=?
SQL1_INPUTS = 1
OUTPUT = 1

[insertOrUpdateUserBySteamId]
;; 1 = steam_id
;; 2 = username
;; 3 = money
;; 4 = is_medic
;; 5 = is_eod
;; 6 = loadout
;; 7 = last_online
;; 8 = grade

SQL1_1 = INSERT INTO users (steam_id, username, money, ingame_name, is_medic, is_eod, loadout, last_online, grade) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?) ON DUPLICATE KEY UPDATE money=?, ingame_name=?, is_medic=?, is_eod=?, loadout=?, last_online=?
SQL1_INPUTS = 1,2,3,2,4,5,6,7,8,3,2,4,5,6,7
